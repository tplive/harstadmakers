name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
EOF
      - name: Install rust target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Build release
        run: |
          cd ttl/backend
          cargo build --release --target aarch64-unknown-linux-gnu
          ls -la target/aarch64-unknown-linux-gnu/release/
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ttl-api-aarch64-unknown-linux-gnu
          path: ttl/backend/target/aarch64-unknown-linux-gnu/release/ttl-api
          compression-level: 9

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/ttl-api-aarch64-unknown-linux-gnu/ttl-api
          draft: false
          prerelease: false