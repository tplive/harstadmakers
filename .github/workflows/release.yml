name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu   # Raspberry Pi ARM64
          - x86_64-unknown-linux-gnu     # Standard x86_64

    steps:
      - uses: actions/checkout@v7
      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          fi
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - name: Build release
        run: |
          cd ttl/backend
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            cargo build --release --target ${{ matrix.target }}
            ls -la target/${{ matrix.target }}/release/
          else
            cargo build --release
            ls -la target/release/
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ttl-api-${{ matrix.target }}
          path: |
            ttl/backend/target/${{ matrix.target }}/release/
            ttl/backend/target/release/
          compression-level: 9

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ttl-api-aarch64-unknown-linux-gnu/ttl-api
            artifacts/ttl-api-x86_64-unknown-linux-gnu/ttl-api
          draft: false
          prerelease: false